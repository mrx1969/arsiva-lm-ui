<!doctype html>
<html lang="id">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="color-scheme" content="light">
    <title><?= appName ?></title>
    <?!= include_('styles'); ?>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Lewati ke konten utama</a>

    <header class="topbar">
      <div class="brand" aria-label="Arsiva-LM">
        <span class="brand-mark" aria-hidden="true">A</span>
        <div>
          <strong><?= appName ?></strong>
          <span class="brand-caption">Kearsipan Internal</span>
        </div>
      </div>

      <div class="topbar-actions">
        <button id="notification-button" class="icon-button" type="button" aria-label="Notifikasi belum dibaca">
          <span aria-hidden="true">●</span>
          <span id="notification-count" class="notification-count">0</span>
        </button>
        <div class="identity" aria-live="polite">
          <strong id="user-name">Memuat pengguna…</strong>
          <span id="user-role">—</span>
        </div>
      </div>
    </header>

    <main id="main-content" class="page-shell">
      <section class="page-heading" aria-labelledby="dashboard-title">
        <div>
          <p class="eyebrow">Ruang kerja arsip</p>
          <h1 id="dashboard-title">Dashboard</h1>
          <p id="dashboard-subtitle" class="muted">Ringkasan arsip sesuai hak akses Anda.</p>
        </div>
        <button id="upload-button" class="primary-button" type="button" disabled>
          Upload Arsip
        </button>
      </section>

      <div id="global-alert" class="alert" role="alert" hidden>
        <div>
          <strong id="alert-title">Data belum dapat dimuat</strong>
          <p id="alert-message"></p>
        </div>
        <button id="retry-button" class="secondary-button" type="button">Coba lagi</button>
      </div>

      <section aria-labelledby="summary-title">
        <div class="section-heading">
          <h2 id="summary-title">Ringkasan</h2>
          <span id="generated-at" class="caption">Memuat…</span>
        </div>

        <div id="stats-grid" class="stats-grid" aria-live="polite">
          <article class="stat-card skeleton-card" aria-label="Memuat statistik"></article>
          <article class="stat-card skeleton-card" aria-label="Memuat statistik"></article>
          <article class="stat-card skeleton-card" aria-label="Memuat statistik"></article>
          <article class="stat-card skeleton-card" aria-label="Memuat statistik"></article>
          <article class="stat-card skeleton-card" aria-label="Memuat statistik"></article>
        </div>
      </section>

      <div class="content-grid">
        <section class="archive-section" aria-labelledby="archive-title">
          <div class="section-heading archive-heading">
            <div>
              <h2 id="archive-title">Arsip</h2>
              <p id="archive-result-summary" class="caption">Memuat arsip terbaru…</p>
            </div>
          </div>

          <div class="filter-bar" aria-label="Filter arsip">
            <label class="search-field">
              <span class="sr-only">Cari arsip</span>
              <input id="archive-search" type="search" placeholder="Cari judul, nomor, atau tag" autocomplete="off">
            </label>

            <label>
              <span class="sr-only">Status arsip</span>
              <select id="status-filter">
                <option value="">Semua status</option>
                <option value="DRAFT">Draft</option>
                <option value="PENDING_L1">Validasi L1</option>
                <option value="PENDING_L2">Validasi L2</option>
                <option value="FINAL">Final</option>
              </select>
            </label>

            <label>
              <span class="sr-only">Jumlah per halaman</span>
              <select id="page-size">
                <option value="20">20 per halaman</option>
                <option value="50">50 per halaman</option>
                <option value="100">100 per halaman</option>
              </select>
            </label>
          </div>

          <div id="archive-list" class="archive-list" aria-live="polite" aria-busy="true">
            <div class="archive-skeleton"></div>
            <div class="archive-skeleton"></div>
            <div class="archive-skeleton"></div>
          </div>

          <nav class="pagination" aria-label="Pagination arsip">
            <button id="previous-page" class="secondary-button" type="button" disabled>Sebelumnya</button>
            <span id="page-label" class="caption">Halaman 1 dari 1</span>
            <button id="next-page" class="secondary-button" type="button" disabled>Berikutnya</button>
          </nav>
        </section>

        <aside class="task-panel" aria-labelledby="task-title">
          <div class="section-heading">
            <h2 id="task-title">Perlu Tindakan</h2>
            <span id="task-count" class="caption">—</span>
          </div>
          <div id="task-list" class="task-list" aria-live="polite" aria-busy="true">
            <div class="task-skeleton"></div>
            <div class="task-skeleton"></div>
          </div>
        </aside>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <footer class="app-footer">
      <span><?= appName ?> v<?= appVersion ?></span>
      <span>Google Workspace Internal</span>
    </footer>

    <?!= include_('scripts'); ?>
  </body>
</html>
