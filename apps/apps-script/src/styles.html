<style>
  :root {
    --font-sans: Aptos, "Aptos Display", "Segoe UI", Arial, sans-serif;
    --ink: #142033;
    --muted: #5d6878;
    --faint: #8993a1;
    --line: #d9dee6;
    --line-strong: #b8c0cc;
    --paper: #ffffff;
    --canvas: #f4f6f8;
    --canvas-deep: #e9edf2;
    --navy: #1f3a5f;
    --navy-deep: #142b49;
    --teal: #0e7c66;
    --teal-deep: #096653;
    --warning: #9b6418;
    --danger: #a23d3d;
    --radius: 4px;
    --content-width: 1600px;
    --transition: 150ms ease;
  }

  * { box-sizing: border-box; }

  html { color-scheme: light; scroll-behavior: smooth; }

  body {
    margin: 0;
    min-width: 320px;
    min-height: 100vh;
    border-top: 3px solid var(--navy);
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.45;
  }

  button, input, select { font: inherit; }
  button, select { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .48; }
  [hidden] { display: none !important; }

  :focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 3px;
  }

  .skip-link {
    position: fixed;
    z-index: 100;
    top: 12px;
    left: 12px;
    padding: 10px 14px;
    background: var(--ink);
    color: #fff;
    transform: translateY(-160%);
  }

  .skip-link:focus { transform: translateY(0); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }

  .topbar {
    position: sticky;
    z-index: 20;
    top: 0;
    min-height: 69px;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 255, 255, .98);
  }

  .topbar__inner {
    width: min(100% - 48px, var(--content-width));
    min-height: 68px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(220px, 1fr) auto minmax(220px, 1fr);
    align-items: stretch;
    gap: 28px;
  }

  .brand { display: inline-flex; align-items: center; gap: 11px; color: inherit; text-decoration: none; justify-self: start; }
  .brand__mark, .account__avatar {
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    border-radius: var(--radius);
    background: var(--navy);
    color: #fff;
    font-weight: 700;
  }
  .brand__copy, .account__copy { display: grid; line-height: 1.15; }
  .brand__copy strong { font-size: 14px; letter-spacing: -.01em; }
  .brand__copy small, .account__copy small { margin-top: 4px; color: var(--muted); font-size: 11px; }

  .primary-nav { display: flex; align-items: stretch; gap: 2px; }
  .nav-item {
    position: relative;
    min-width: 84px;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    transition: color var(--transition), background var(--transition);
  }
  .nav-item::after { content: ""; position: absolute; right: 14px; bottom: -1px; left: 14px; height: 2px; background: transparent; }
  .nav-item:hover { background: #f6f8fa; color: var(--ink); }
  .nav-item.is-active { color: var(--navy); }
  .nav-item.is-active::after { background: var(--teal); }

  .account-tools { display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
  .notification-button {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 11px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
    font-size: 12px;
    font-weight: 700;
  }
  .notification-button__signal { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); }
  .account { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .account__avatar { width: 32px; height: 32px; background: var(--canvas-deep); color: var(--navy); }
  .account__copy { max-width: 160px; }
  .account__copy strong { overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }

  .page-shell { width: min(100% - 64px, var(--content-width)); margin: 0 auto; padding: 48px 0 0; }
  .command-band {
    min-height: 164px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: end;
    gap: 48px;
    padding: 0 0 34px;
    border-bottom: 1px solid var(--line-strong);
  }
  .eyebrow, .section-index {
    margin: 0 0 7px;
    color: var(--teal);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  h1, h2, h3, p { margin-top: 0; }
  h1 { margin-bottom: 5px; font-size: clamp(32px, 4vw, 52px); line-height: 1; letter-spacing: -.04em; }
  h2 { margin-bottom: 0; font-size: 20px; line-height: 1.2; letter-spacing: -.02em; }
  h3 { margin: 3px 0 7px; font-size: 16px; line-height: 1.3; }
  .lede { max-width: 650px; margin-bottom: 8px; color: var(--muted); font-size: 16px; }
  .update-note { margin: 0; color: var(--faint); font-size: 12px; }
  .command-band__action { display: grid; justify-items: end; gap: 7px; padding-bottom: 3px; }
  .command-hint { color: var(--faint); font-size: 11px; }

  .button {
    min-height: 40px;
    padding: 0 15px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    font-weight: 700;
    transition: background var(--transition), border-color var(--transition), color var(--transition);
  }
  .button--primary { min-width: 132px; background: var(--teal); color: #fff; }
  .button--primary:hover:not(:disabled) { background: var(--teal-deep); }
  .button--secondary { border-color: var(--line); background: var(--paper); color: var(--navy); }
  .button--secondary:hover:not(:disabled) { border-color: var(--navy); }

  .alert { margin-top: 24px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 24px; border-left: 3px solid var(--danger); background: #fff4f3; }
  .alert p { margin: 3px 0 0; color: var(--muted); }

  .summary-section { padding: 31px 0 0; }
  .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 15px; }
  .section-index { margin-bottom: 4px; color: var(--faint); }
  .section-note, .result-count { margin: 0; color: var(--muted); font-size: 12px; }
  .metric-ledger {
    display: grid;
    grid-template-columns: 1.35fr repeat(3, 1fr);
    border-top: 2px solid var(--navy);
    border-bottom: 1px solid var(--line-strong);
    background: var(--paper);
  }
  .metric-cell { position: relative; min-height: 110px; padding: 21px 22px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid var(--line); }
  .metric-cell:last-child { border-right: 0; }
  .metric-cell::before { content: ""; position: absolute; top: -2px; right: 0; left: 0; height: 2px; background: transparent; }
  .metric-cell[data-tone="draft"]::before { background: var(--faint); }
  .metric-cell[data-tone="verification"]::before { background: var(--warning); }
  .metric-cell[data-tone="final"]::before { background: var(--teal); }
  .metric-label { color: var(--muted); font-size: 12px; }
  .metric-value { font-size: 33px; line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }

  .workbench { display: grid; grid-template-columns: minmax(0, 3fr) minmax(280px, 1fr); margin-top: 44px; border-top: 1px solid var(--line-strong); }
  .archive-workspace { min-width: 0; padding: 30px 32px 0 0; }
  .section-heading--workspace { margin-bottom: 21px; }
  .result-count { padding-bottom: 2px; font-variant-numeric: tabular-nums; }
  .archive-toolbar { display: grid; grid-template-columns: minmax(260px, 1fr) 170px 112px; gap: 8px; margin-bottom: 0; padding: 10px; border: 1px solid var(--line); background: var(--paper); }
  .search-field { position: relative; display: flex; align-items: center; }
  .search-field__mark { position: absolute; left: 13px; width: 12px; height: 12px; border: 1.5px solid var(--muted); border-radius: 50%; pointer-events: none; }
  .search-field__mark::after { content: ""; position: absolute; width: 6px; height: 1.5px; right: -5px; bottom: -3px; background: var(--muted); transform: rotate(45deg); }
  .search-field input, .select-field select {
    width: 100%;
    height: 42px;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: #fbfcfd;
    color: var(--ink);
  }
  .search-field input { padding: 0 13px 0 38px; }
  .select-field { position: relative; }
  .select-field > span { position: absolute; z-index: 1; top: 4px; left: 11px; color: var(--faint); font-size: 9px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; pointer-events: none; }
  .select-field select { padding: 13px 30px 0 10px; font-size: 13px; }
  .search-field input:hover, .select-field select:hover { border-color: var(--line-strong); }

  .archive-list { min-height: 355px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.35); }
  .archive-item { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 24px; min-height: 105px; padding: 18px 17px 18px 20px; border-bottom: 1px solid var(--line); background: var(--paper); cursor: pointer; transition: background var(--transition); }
  .archive-item::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 3px; background: transparent; }
  .archive-item:hover { background: #fafcfc; }
  .archive-item:hover::before { background: var(--teal); }
  .archive-number { color: var(--teal); font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .archive-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 12px; }
  .archive-meta span + span { position: relative; }
  .archive-meta span + span::before { content: ""; position: absolute; top: .55em; left: -9px; width: 2px; height: 2px; border-radius: 50%; background: var(--faint); }
  .status-badge { min-width: 94px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 2px; background: #f7f8fa; color: var(--muted); font-size: 11px; font-weight: 700; text-align: center; }
  .status-PENDING_VERIFICATION, .status-PENDING_L1, .status-PENDING_L2 { border-color: #dfc795; background: #fff9ed; color: #80510e; }
  .status-FINAL { border-color: #9bc8bc; background: #f0faf7; color: var(--teal-deep); }
  .status-DRAFT { color: #596271; }

  .empty-state { min-height: 285px; padding: 56px 30px; display: grid; place-items: center; align-content: center; gap: 10px; color: var(--muted); text-align: center; }
  .empty-state::before { content: ""; width: 42px; height: 50px; border: 1px solid var(--line-strong); border-top: 3px solid var(--navy); background: var(--paper); box-shadow: inset 0 11px 0 var(--paper), inset 0 12px 0 var(--line), inset 0 23px 0 var(--paper), inset 0 24px 0 var(--line), inset 0 35px 0 var(--paper), inset 0 36px 0 var(--line); }
  .empty-state strong { color: var(--ink); font-size: 14px; }
  .empty-state span { max-width: 390px; font-size: 13px; }

  .pagination { min-height: 76px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; color: var(--muted); font-size: 12px; }
  .pagination .button:first-child { justify-self: start; }
  .pagination .button:last-child { justify-self: end; }

  .task-rail { min-height: 550px; padding: 30px 0 30px 30px; border-left: 1px solid var(--line-strong); }
  .task-rail__head { display: flex; justify-content: space-between; gap: 18px; align-items: end; }
  .task-count { padding-bottom: 2px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .task-rail__intro { margin: 13px 0 23px; max-width: 300px; color: var(--muted); font-size: 13px; }
  .task-list { border-top: 1px solid var(--line); }
  .task-item { padding: 16px 4px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); cursor: pointer; transition: padding var(--transition), background var(--transition); }
  .task-item:hover { padding-inline: 8px; background: var(--paper); }
  .task-item strong { font-size: 13px; }
  .caption { color: var(--muted); font-size: 11px; }
  .task-list .empty-state { min-height: 225px; padding-inline: 12px; }
  .task-list .empty-state::before { width: 32px; height: 38px; }

  .site-footer { width: min(100% - 64px, var(--content-width)); margin: 28px auto 0; min-height: 82px; padding-top: 20px; display: flex; justify-content: space-between; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
  .toast { position: fixed; z-index: 50; right: 24px; bottom: 24px; max-width: 390px; padding: 13px 16px; border-left: 3px solid var(--teal); background: var(--ink); color: #fff; box-shadow: 0 6px 20px rgba(20,32,51,.16); }

  .notification-panel {
    position: fixed;
    z-index: 40;
    top: 78px;
    right: 24px;
    width: min(390px, calc(100vw - 32px));
    max-height: calc(100vh - 102px);
    overflow: auto;
    border: 1px solid var(--line-strong);
    border-top: 3px solid var(--navy);
    background: var(--paper);
    box-shadow: 0 12px 30px rgba(20,32,51,.14);
  }
  .panel-head, .dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; padding: 20px; border-bottom: 1px solid var(--line); }
  .icon-close { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); color: var(--muted); font-size: 22px; line-height: 1; }
  .icon-close:hover { border-color: var(--navy); color: var(--navy); }
  .notification-list { min-height: 100px; }
  .notification-item { position: relative; width: 100%; padding: 16px 20px; display: grid; gap: 5px; border: 0; border-bottom: 1px solid var(--line); background: #f7fbfa; color: var(--ink); text-align: left; }
  .notification-item::before { content: ""; position: absolute; top: 21px; left: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--teal); }
  .notification-item:hover { background: #f0f6f4; }
  .notification-item.is-read { background: var(--paper); }
  .notification-item.is-read::before { background: transparent; }
  .notification-item strong { font-size: 13px; }
  .notification-item span { color: var(--muted); font-size: 12px; line-height: 1.4; }
  .notification-item small { color: var(--faint); font-size: 10px; }
  .panel-empty, .loading-line, .inline-error { padding: 28px 20px; color: var(--muted); font-size: 13px; text-align: center; }
  .inline-error { color: var(--danger); }

  .record-dialog {
    width: min(760px, calc(100vw - 32px));
    max-height: calc(100vh - 48px);
    padding: 0;
    overflow: auto;
    border: 1px solid var(--line-strong);
    border-top: 4px solid var(--navy);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
    box-shadow: 0 18px 50px rgba(20,32,51,.2);
  }
  .record-dialog--compact { width: min(620px, calc(100vw - 32px)); }
  .record-dialog::backdrop { background: rgba(20,32,51,.48); }
  .dialog-head { padding: 24px 26px 20px; }
  .dialog-head h2 { max-width: 580px; }
  .record-detail { min-height: 200px; padding: 25px 26px; }
  .detail-grid { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .detail-grid > div { min-height: 76px; padding: 13px 15px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .detail-grid dt { margin-bottom: 5px; color: var(--faint); font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
  .detail-grid dd { margin: 0; overflow-wrap: anywhere; font-size: 13px; font-weight: 600; }
  .detail-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .detail-tags span { padding: 4px 7px; border: 1px solid var(--line); color: var(--muted); font-size: 11px; }
  .dialog-actions { padding: 15px 26px 22px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--line); }
  .integration-note { padding: 24px 26px; color: var(--muted); }
  .integration-note p { margin-bottom: 16px; }
  .integration-note ol { margin: 0 0 18px; padding-left: 20px; color: var(--ink); }
  .integration-note li { padding: 4px 0; }

  .skeleton-cell span, .skeleton-cell strong, .list-skeleton i, .list-skeleton span, .list-skeleton b, .task-skeleton span, .task-skeleton i { display: block; background: var(--canvas-deep); animation: pulse 1.2s ease-in-out infinite alternate; }
  .skeleton-cell span { width: 46%; height: 9px; }
  .skeleton-cell strong { width: 24%; height: 27px; }
  .list-skeleton { min-height: 105px; padding: 21px; display: grid; grid-template-columns: minmax(0,1fr) 92px; gap: 12px 30px; border-bottom: 1px solid var(--line); background: var(--paper); }
  .list-skeleton i { width: 25%; height: 9px; }
  .list-skeleton span { width: 56%; height: 17px; grid-row: 2; }
  .list-skeleton b { width: 92px; height: 26px; grid-row: 1 / span 2; grid-column: 2; align-self: center; }
  .task-skeleton { padding: 18px 4px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
  .task-skeleton span { width: 60%; height: 12px; }
  .task-skeleton i { width: 42%; height: 9px; }

  @keyframes pulse { from { opacity: .45; } to { opacity: 1; } }

  @media (max-width: 1100px) {
    .topbar__inner { grid-template-columns: 1fr auto; }
    .primary-nav { position: fixed; z-index: 25; right: 0; bottom: 0; left: 0; min-height: 62px; justify-content: space-around; border-top: 1px solid var(--line); background: var(--paper); }
    .nav-item { flex: 1; min-width: 0; padding: 8px 5px; font-size: 11px; }
    .nav-item::after { top: -1px; right: 24%; bottom: auto; left: 24%; }
    .workbench { grid-template-columns: minmax(0, 1fr); }
    .archive-workspace { padding-right: 0; }
    .task-rail { min-height: 0; padding: 30px 0; border-top: 1px solid var(--line-strong); border-left: 0; }
    .site-footer { margin-bottom: 62px; }
    .toast { bottom: 78px; }
    .notification-panel { top: 76px; right: 16px; }
  }

  @media (max-width: 720px) {
    body { font-size: 14px; }
    .topbar__inner { width: min(100% - 28px, var(--content-width)); gap: 12px; }
    .brand__copy small, .account__copy { display: none; }
    .page-shell { width: min(100% - 28px, var(--content-width)); padding-top: 30px; }
    .command-band { min-height: 0; grid-template-columns: 1fr; align-items: start; gap: 24px; padding-bottom: 28px; }
    .command-band__action { width: 100%; grid-template-columns: 1fr auto; align-items: center; justify-items: start; }
    h1 { font-size: 38px; }
    .summary-section { padding-top: 27px; }
    .section-note { display: none; }
    .metric-ledger { grid-template-columns: repeat(2, 1fr); }
    .metric-cell { min-height: 92px; padding: 16px; border-bottom: 1px solid var(--line); }
    .metric-cell:nth-child(2n) { border-right: 0; }
    .metric-cell:last-child { grid-column: auto; border-bottom: 0; }
    .workbench { margin-top: 34px; }
    .archive-workspace { padding-top: 25px; }
    .archive-toolbar { grid-template-columns: 1fr 1fr; }
    .search-field { grid-column: 1 / -1; }
    .archive-item { grid-template-columns: 1fr; gap: 12px; }
    .status-badge { justify-self: start; }
    .pagination { grid-template-columns: 1fr 1fr; padding: 13px 0; }
    .pagination span { grid-column: 1 / -1; grid-row: 1; text-align: center; }
    .pagination .button { grid-row: 2; }
    .site-footer { width: min(100% - 28px, var(--content-width)); flex-direction: column; gap: 8px; }
    .toast { right: 14px; left: 14px; }
    .detail-grid { grid-template-columns: 1fr; }
    .dialog-actions { flex-wrap: wrap; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }

  /* Application shell: sidebar navigation for internal workflows. */
  body { border-top: 0; }
  .app-shell { min-height: 100dvh; }
  .app-sidebar {
    position: fixed;
    z-index: 30;
    inset: 0 auto 0 0;
    width: 264px;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    border-right: 1px solid var(--line-strong);
    background: var(--paper);
  }
  .sidebar-brand {
    min-height: 82px;
    padding: 18px 19px;
    display: flex;
    align-items: center;
    gap: 11px;
    border-bottom: 1px solid var(--line);
  }
  .sidebar-brand .brand__copy { min-width: 0; }
  .sidebar-brand .brand__mark { width: 38px; height: 38px; padding: 2px; border: 1px solid var(--line); background: var(--paper); }
  .sidebar-brand .brand__mark img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .sidebar-brand .brand__copy strong { font-size: 15px; }
  .sidebar-close { display: none; margin-left: auto; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); color: var(--muted); font-size: 21px; }
  .sidebar-nav { overflow-y: auto; padding: 18px 12px 28px; scrollbar-width: thin; }
  .nav-group + .nav-group { margin-top: 25px; }
  .nav-group__label { margin: 0 10px 7px; color: var(--faint); font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
  .side-nav-item {
    width: 100%;
    min-height: 43px;
    padding: 0 10px;
    display: grid;
    grid-template-columns: 22px minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    text-align: left;
    transition: background var(--transition), border-color var(--transition), color var(--transition), transform var(--transition);
  }
